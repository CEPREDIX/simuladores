<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pizarra CEPREDIX</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/234/234633.png">
<style>
  :root {
    --bg: #f3f1eb; --surface: #fffcf8; --fg: #1b1b18; --muted: #6d6960;
    --border: #e2ddd3; --accent: #2d343c; --accent-fg: #f4f2ec;
    --dot: #d5cfc3; --shadow: 0 8px 28px rgba(28,27,24,.08);
  }
  html.dark {
    --bg: #111214; --surface: #1b1c20; --fg: #f2f0e9; --muted: #9a968c;
    --border: #2c2e34; --accent: #d8d3c7; --accent-fg: #151618;
    --dot: #2a2c32; --shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--fg); background: var(--bg); overflow: hidden;
  }
  #viewport {
    position: relative; width: 100%; height: 100%;
    background-image: radial-gradient(var(--dot) 1.1px, transparent 1.1px);
    background-size: 22px 22px; touch-action: none;
  }
  #mediaWorld, #world, #widgetWorld { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  #mediaWorld { z-index: 0; }
  #mediaWorld.interacting { z-index: 4; }
  #world { z-index: 2; }
  #widgetWorld { z-index: 3; }
  #draw { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  #chrome { position: absolute; left: 0; top: 0; transform-origin: 0 0; z-index: 5; pointer-events: none; }
  .obj { position: absolute; pointer-events: none; user-select: none; }
  .obj img, .obj video { display: block; width: 100%; height: 100%; object-fit: contain; border: 0; background: #111; }
  .obj.media-active, .obj.media-active video, .obj.media-active iframe, .obj.media-active .yt-wrap { pointer-events: auto; }
  .obj.media-active { outline: 2px solid color-mix(in oklab, var(--accent) 65%, transparent); }
  .obj .yt-wrap { position: relative; width: 100%; height: 100%; background: #111; }
  .obj .yt-wrap iframe { display: block; width: 100%; height: 100%; border: 0; }
  .selbox { position: absolute; outline: 2px solid var(--accent); pointer-events: none; }
  .dragbar {
    position: absolute; left: 0; right: 0; top: -22px; height: 22px;
    background: var(--accent); color: var(--accent-fg); font-size: 10px;
    text-align: center; line-height: 22px; cursor: grab; pointer-events: auto;
  }
  .h {
    position: absolute; width: 10px; height: 10px; background: var(--surface);
    border: 1.5px solid var(--accent); pointer-events: auto;
  }
  .h.nw { left: -5px; top: -5px; cursor: nwse-resize; }
  .h.ne { right: -5px; top: -5px; cursor: nesw-resize; }
  .h.sw { left: -5px; bottom: -5px; cursor: nesw-resize; }
  .h.se { right: -5px; bottom: -5px; cursor: nwse-resize; }
  .h.rot { left: 50%; top: -44px; border-radius: 50%; transform: translateX(-50%); cursor: grab; }
  .rot-line { position: absolute; left: 50%; top: -40px; width: 1px; height: 18px; background: var(--accent); transform: translateX(-50%); }
  .play {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,0,.3); border: 0; cursor: pointer; pointer-events: auto;
  }
  .play span {
    width: 52px; height: 52px; border-radius: 50%; background: var(--surface);
    display: grid; place-items: center; box-shadow: var(--shadow); font-size: 18px;
  }
  .shapecolor {
    position: absolute; right: -8px; top: -28px; width: 22px; height: 22px;
    border: 0; padding: 0; pointer-events: auto; cursor: pointer; background: transparent;
  }

  #leftdock {
    position: fixed; z-index: 40; left: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    max-height: 90vh;
  }
  #rightdock {
    position: fixed; z-index: 40; right: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    max-height: 90vh;
  }

  .markers {
    display: flex; flex-direction: column; gap: 6px;
    background: color-mix(in oklab, var(--surface) 88%, transparent);
    padding: 8px; border-radius: 16px;
    border: 1px solid var(--border); box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
  }
  .marker {
    width: 40px; height: 40px; border-radius: 12px; border: 2px solid transparent;
    background: color-mix(in oklab, var(--surface) 92%, transparent);
    box-shadow: 0 2px 6px rgba(0,0,0,.1); cursor: pointer; position: relative;
    display: grid; place-items: center; opacity: .92;
    transition: transform .12s, border-color .12s;
  }
  .marker:hover { transform: scale(1.05); }
  .marker.on { border-color: var(--fg); opacity: 1; }
  .marker .nib {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.2);
  }
  .marker .hl-nib { border-radius: 5px; height: 16px; width: 24px; }
  .marker .plus {
    position: absolute; bottom: -2px; right: -2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); color: var(--accent-fg);
    font-size: 10px; line-height: 14px; text-align: center;
    border: 1.5px solid var(--surface);
  }

  .fab {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
    background: color-mix(in oklab, var(--surface) 92%, transparent);
    color: var(--fg); cursor: pointer; backdrop-filter: blur(10px);
    box-shadow: var(--shadow); display: grid; place-items: center; opacity: .85; font-size: 15px;
    flex-shrink: 0;
  }
  .fab:hover, .fab.on { opacity: 1; background: var(--accent); color: var(--accent-fg); }

  .sheet {
    display: none; background: color-mix(in oklab, var(--surface) 96%, transparent);
    border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
    backdrop-filter: blur(12px); padding: 8px;
    max-height: 80vh; overflow-y: auto;
  }
  .sheet.open { display: block; }
  #tools.open { display: flex; flex-direction: column; gap: 4px; }
  #shapes.open { display: grid; grid-template-columns: 1fr; gap: 4px; width: 150px; }
  #exportbox.open, #radio.open { display: block; width: 230px; }
  .tool {
    width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent;
    color: var(--fg); cursor: pointer; display: grid; place-items: center; font-size: 15px;
    flex-shrink: 0;
  }
  .tool:hover { background: var(--bg); }
  .tool.active { background: var(--accent); color: var(--accent-fg); }
  .sep { width: 24px; height: 1px; background: var(--border); margin: 3px 0; flex-shrink: 0; }
  label.thin { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; color: var(--muted); width: 36px; flex-shrink: 0; }
  label.thin input { width: 100%; }
  .shp {
    border: 0; background: var(--bg); color: var(--fg); border-radius: 8px;
    padding: 8px; font: inherit; font-size: 11px; text-align: left; cursor: pointer;
  }
  .shp:hover, .shp.active { background: var(--accent); color: var(--accent-fg); }
  h4 { margin: 0 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .row { display: flex; gap: 4px; margin-top: 6px; align-items: center; }
  .row input, .row button {
    height: 28px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font: inherit;
  }
  .row input { flex: 1; padding: 0 6px; min-width: 0; }
  .row button { background: var(--accent); color: var(--accent-fg); border: 0; cursor: pointer; padding: 0 10px; }
  .mood {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    color: var(--muted); padding: 6px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .mood.on, .mood:hover { background: var(--bg); color: var(--fg); }
  .bars { height: 22px; display: flex; align-items: flex-end; gap: 2px; margin: 6px 0 8px; }
  .bars i { flex: 1; height: 100%; background: var(--fg); opacity: .5; border-radius: 1px; transform: scaleY(.14); transform-origin: bottom; }

  #boardTitle {
    position: fixed; z-index: 42; left: 12px; top: 10px; width: min(330px, 42vw);
    border: 1px solid var(--border); border-radius: 11px; padding: 8px 11px;
    background: color-mix(in oklab, var(--surface) 90%, transparent); color: var(--fg);
    box-shadow: var(--shadow); backdrop-filter: blur(10px); font: 600 13px/1.2 inherit;
    outline: none;
  }
  #boardTitle:focus { border-color: var(--accent); background: var(--surface); }
  #timer {
    position: fixed; z-index: 40; top: 10px; right: 10px;
    display: flex; align-items: center; gap: 4px;
    background: color-mix(in oklab, var(--surface) 88%, transparent);
    border: 1px solid var(--border); border-radius: 14px; padding: 7px 9px;
    box-shadow: var(--shadow); backdrop-filter: blur(10px); opacity: .9; font-size: 13px;
  }
  #timer:hover, #timer.open { opacity: 1; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; letter-spacing: .04em; min-width: 72px; text-align:center; cursor:pointer; }
  #timer .extra { display: none; align-items: center; gap: 4px; }
  #timer.open .extra { display: flex; }
  #timer .extra input {
    width: 46px; height: 30px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 11px; text-align: center;
  }
  #timer button {
    width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent;
    color: var(--fg); cursor: pointer;
  }
  #timer button:hover { background: var(--bg); }

  #menu {
    position: fixed; z-index: 80; min-width: 168px; display: none;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  }
  #menu button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--fg);
  }
  #menu button:hover { background: var(--bg); }
  .pulse { pointer-events: none; position: fixed; inset: 0; z-index: 70; }
  .pulse.y { box-shadow: inset 0 0 0 5px rgb(234 179 8 / .5); }
  .pulse.o { box-shadow: inset 0 0 0 6px rgb(234 88 12 / .58); }
  .pulse.r { box-shadow: inset 0 0 0 7px rgb(220 38 38 / .68); }
  @keyframes pulseGlow {
    0%, 100% { opacity: .25; }
    50% { opacity: 1; }
  }
  .pulse.y { animation: pulseGlow 1.5s ease-in-out infinite; }
  .pulse.o { animation: pulseGlow 1.1s ease-in-out infinite; }
  .pulse.r { animation: pulseGlow .7s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none !important; } }

  /* TEXTOS */
  .text-obj {
    position: absolute; pointer-events: none; user-select: none;
    min-width: 60px; min-height: 24px;
  }
  .text-obj .text-content {
    width: 100%; height: 100%; padding: 4px 6px;
    background: transparent; border: 1px dashed transparent;
    outline: none; font-size: 18px; line-height: 1.4;
    color: var(--fg); word-wrap: break-word; overflow-wrap: break-word;
    white-space: pre-wrap; cursor: text; pointer-events: none;
    font-family: "Segoe UI", system-ui, sans-serif;
    transition: border-color .15s;
  }
  .layerbar {
    position: absolute; right: 0; top: calc(100% + 7px); display: flex; gap: 3px;
    padding: 3px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); box-shadow: var(--shadow); pointer-events: auto;
  }
  .layerbar button {
    width: 28px; height: 25px; border: 0; border-radius: 5px; cursor: pointer;
    color: var(--fg); background: transparent; font: 12px/1 system-ui;
  }
  .layerbar button:hover { color: var(--accent-fg); background: var(--accent); }
  .text-obj.editing, .text-obj.editing .text-content { pointer-events: auto; user-select: text; }
  .text-obj .text-content:focus {
    border-color: var(--accent);
    background: color-mix(in oklab, var(--surface) 60%, transparent);
  }
  .text-toolbar {
    position: fixed; display: none; gap: 2px; padding: 4px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: var(--shadow); z-index: 90;
    pointer-events: auto; flex-wrap: wrap; align-items: center;
  }
  .text-toolbar.show { display: flex; }
  .text-toolbar button {
    width: 28px; height: 28px; border: 0; border-radius: 5px;
    background: transparent; color: var(--fg); cursor: pointer; font-size: 13px;
    display: grid; place-items: center;
  }
  .text-toolbar button:hover { background: var(--bg); }
  .text-toolbar button.active { background: var(--accent); color: var(--accent-fg); }
  .text-toolbar .tsep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
  .text-toolbar .color-wrap {
    position: relative; width: 28px; height: 28px;
    display: grid; place-items: center; border-radius: 5px; cursor: pointer;
  }
  .text-toolbar .color-wrap:hover { background: var(--bg); }
  .text-toolbar .color-wrap input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .text-toolbar .color-ind {
    width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border);
    pointer-events: none;
  }

  #hlPicker {
    position: fixed; z-index: 100; display: none; flex-direction: column; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px; box-shadow: var(--shadow);
    align-items: center;
  }
  #hlPicker.show { display: flex; }
  #hlPicker .swatches { display: flex; flex-direction: column; gap: 4px; }
  #hlPicker .sw {
    width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--border);
    cursor: pointer; padding: 0;
  }
  #hlPicker .sw.on { border-color: var(--fg); }
  #hlPicker .custom { width: 26px; height: 26px; border: 0; padding: 0; background: transparent; cursor: pointer; }

  .hint {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    background: color-mix(in oklab, var(--surface) 92%, transparent);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 14px; font-size: 10px; color: var(--muted);
    box-shadow: var(--shadow); backdrop-filter: blur(10px);
    z-index: 40; opacity: .8; pointer-events: none;
    transition: opacity .3s;
  }
  .hint.hide { opacity: 0; }

  /* OBJETOS DIDÁCTICOS */
  .widget { position:absolute; background:#fff; color:#17202a; border:1px solid #cbd5e1; border-radius:10px; overflow:hidden; box-shadow:0 3px 14px rgba(0,0,0,.12); }
  .widget canvas { width:100%; height:100%; display:block; }
  .table-widget { padding:8px; overflow:auto; }
  .table-widget table { width:100%; border-collapse:collapse; font:13px/1.25 system-ui; }
  .table-widget th,.table-widget td { border:1px solid #94a3b8; padding:5px 7px; text-align:center; }
  .table-widget th { background:#e2e8f0; font-weight:700; }
  .widget-badge { position:absolute; right:6px; top:5px; padding:2px 6px; border-radius:999px; background:rgba(255,255,255,.82); font:10px system-ui; color:#475569; }
  .modal { position:fixed; inset:0; z-index:120; display:none; place-items:center; background:rgba(15,23,42,.38); padding:20px; }
  .modal.open { display:grid; }
  .dialog { width:min(620px,96vw); max-height:90vh; overflow:auto; background:var(--surface); color:var(--fg); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:0 20px 70px rgba(0,0,0,.28); }
  .dialog h3 { margin:0 0 10px; font-size:16px; }
  .dialog label { display:block; margin:9px 0 4px; font-size:12px; color:var(--muted); }
  .dialog textarea,.dialog input,.dialog select { width:100%; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--fg); padding:8px; font:13px inherit; }
  .dialog textarea { min-height:90px; resize:vertical; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:7px; margin-top:12px; }
  .dialog-actions button,.mini-btn { border:0; border-radius:8px; padding:8px 12px; background:var(--accent); color:var(--accent-fg); cursor:pointer; }
  #calculator { position:fixed; z-index:105; left:50%; top:90px; width:290px; display:none; background:var(--surface); border:1px solid var(--border); border-radius:15px; box-shadow:var(--shadow); overflow:hidden; }
  #calculator.open { display:block; }
  .calc-head { padding:9px 11px; background:var(--accent); color:var(--accent-fg); display:flex; justify-content:space-between; cursor:move; user-select:none; font-size:12px; }
  .calc-body { padding:10px; }
  #calcDisplay { width:100%; height:44px; text-align:right; font:20px ui-monospace,monospace; border:1px solid var(--border); border-radius:8px; padding:6px; background:var(--bg); color:var(--fg); }
  .calc-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:7px; }
  .calc-grid button { min-height:34px; border:0; border-radius:7px; background:var(--bg); color:var(--fg); cursor:pointer; }
  .calc-grid button:hover { background:var(--border); }
  .calc-sci { display:none; grid-column:span 4; grid-template-columns:repeat(4,1fr); gap:5px; }
  #calculator.scientific .calc-sci { display:grid; }
</style>
</head>
<body>
<div id="viewport">
  <div id="mediaWorld"></div>
  <div id="world"></div>
  <div id="widgetWorld"></div>
  <canvas id="draw"></canvas>
  <div id="chrome"></div>
</div>

<input id="boardTitle" maxlength="80" aria-label="Nombre de la pizarra">
<div id="timer" title="Temporizador">
  <span id="clock">05:00</span>
  <div class="extra">
    <input id="hour" type="number" min="0" max="23" value="0" aria-label="Horas" title="Horas">
    <input id="min" type="number" min="0" max="99" value="5" aria-label="Minutos">
    <input id="sec" type="number" min="0" max="59" value="0" aria-label="Segundos">
    <button id="tstart" title="Iniciar">▶</button>
    <button id="tpause" title="Pausa">⏸</button>
    <button id="treset" title="Reiniciar">↺</button>
  </div>
</div>

<div id="leftdock">
  <div class="markers" id="markerBox"></div>
  <div id="shapes" class="sheet">
    <button class="shp" data-shape="triEq">△ Equilátero</button>
    <button class="shp" data-shape="triIso">△ Isósceles</button>
    <button class="shp" data-shape="triSca">△ Escaleno</button>
    <button class="shp" data-shape="triRight">△ Recto</button>
    <button class="shp" data-shape="quad">▭ Cuadrilátero · Ctrl = cuadrado</button>
    <button class="shp" data-shape="pent">⬠ Pentágono</button>
    <button class="shp" data-shape="hex">⬡ Hexágono</button>
    <button class="shp" data-shape="ellipse">⬭ Elipse · Ctrl = círculo</button>
  </div>
  <button class="fab" id="btn-shapes" title="Formas">⬡</button>
</div>

<div id="rightdock">
  <div id="tools" class="sheet">
    <button class="tool" data-tool="select" title="Seleccionar (V)">↖</button>
    <button class="tool" data-tool="pan" title="Mover (H)">✋</button>
    <span class="sep"></span>
    <button class="tool" data-tool="erasePixel" title="Borrar zona (E)">▁</button>
    <button class="tool" data-tool="eraseStroke" title="Borrar elemento (X)">✕</button>
    <span class="sep"></span>
    <button class="tool" data-tool="line" title="Línea">╱</button>
    <button class="tool" data-tool="arrow" title="Flecha">➜</button>
    <button class="tool" data-tool="text" title="Texto (T)">T</button>
    <button class="tool" id="addGraph" title="Agregar graficadora">ƒ</button>
    <button class="tool" id="addTable" title="Agregar tabla">▦</button>
    <span class="sep"></span>
    <button class="tool" id="btn-autosnap" title="Autoajustar figuras">⌗</button>
    <label class="thin">grosor <input id="width" type="range" min="1" max="48" value="4"></label>
    <button class="tool" id="clear" title="Limpiar todo">⌫</button>
  </div>

  <div id="exportbox" class="sheet">
    <h4>Exportar lienzo</h4>
    <div class="row">
      <button id="expng">Imagen</button>
      <button id="expdf">PDF</button>
    </div>
  </div>

  <div id="radio" class="sheet">
    <h4>Ambiente sonoro</h4>
    <div class="bars" id="bars"></div>
    <div id="moods"></div>
    <div class="row">
      <button id="radioplay">▶</button>
      <input id="vol" type="range" min="0" max="0.4" step="0.01" value="0.16" aria-label="Volumen">
    </div>
  </div>

  <button class="fab" id="btn-tools" title="Herramientas">☰</button>
  <button class="fab" id="btn-export" title="Exportar">↓</button>
  <button class="fab" id="btn-radio" title="Ambiente">♫</button>
  <button class="fab" id="btn-calc" title="Calculadora">🧮</button>
  <button class="fab" id="btn-theme" title="Tema">◐</button>
</div>

<div id="hlPicker">
  <div class="swatches" id="hlSwatches"></div>
  <input type="color" class="custom" id="hlColor" value="#ffe100" title="Color personalizado">
</div>

<div class="text-toolbar" id="textToolbar">
  <button data-cmd="bold" title="Negrita"><b>B</b></button>
  <button data-cmd="italic" title="Itálica"><i>I</i></button>
  <button data-cmd="underline" title="Subrayado"><u>U</u></button>
  <span class="tsep"></span>
  <div class="color-wrap" title="Color de texto">
    <div class="color-ind" id="textColorInd" style="background:#1b1b18"></div>
    <input type="color" id="textColor" value="#1b1b18">
  </div>
  <span class="tsep"></span>
  <button data-cmd="insertUnorderedList" title="Viñetas">•</button>
  <button data-cmd="insertOrderedList" title="Numerada">1.</button>
  <span class="tsep"></span>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const viewport = $("#viewport");
  const canvas = $("#draw");
  let ctx = canvas.getContext("2d");
  const mediaWorld = $("#mediaWorld");
  const world = $("#world");
  const widgetWorld = $("#widgetWorld");
  const chrome = $("#chrome");
  const menu = $("#menu");
  const pulse = $("#pulse");
  const textToolbar = $("#textToolbar");
  const hlPicker = $("#hlPicker");
  const hlSwatches = $("#hlSwatches");
  const hlColor = $("#hlColor");
  const hint = $("#hint");

  const S = {
    tool: "pen",
    shape: null,
    penColors: ["#111111", "#22c55e", "#ef4444", "#3b82f6"],
    hlColor: "#ffe100",
    hlHistory: ["#ffe100", "#a7f3d0", "#bfdbfe", "#fbcfe8", "#fed7aa"],
    ci: 0,
    brush: 4,
    eraser: 22,
    panX: 48, panY: 48, scale: 1,
    strokes: [],
    shapes: [],
    media: [],
    texts: [],
    widgets: [],
    boardName: "",
    selected: null,
    selKind: null,
    z: 1,
    autoSnap: false,
    editingText: null,
    history: [],
    historyIndex: -1,
    maxHistory: 80,
    textClick: null,
    textColor: "#1b1b18",
    mediaInteractive: null,
  };
  let live = null, panning = false, last = { x: 0, y: 0 }, space = false, drag = null, rightPress = null;
  const DRAW = ["pen", "erasePixel", "line", "arrow", "highlight"];
  const uid = () => crypto.randomUUID();
  const color = () => S.penColors[S.ci];
  const worldPt = (e) => ({ x: (e.clientX - S.panX) / S.scale, y: (e.clientY - S.panY) / S.scale });

  let persistTimer = 0;
  function serializableState() {
    return { version: 3, strokes: S.strokes, shapes: S.shapes,
      media: S.media.filter(m => !String(m.src).startsWith("blob:")), texts: S.texts, widgets: S.widgets,
      z: S.z, panX: S.panX, panY: S.panY, scale: S.scale,
      penColors: S.penColors, hlColor: S.hlColor, boardName: S.boardName };
  }
  function persistNow() {
    try { localStorage.setItem("pizarra-personal-v2", JSON.stringify(serializableState())); } catch (_) {}
  }
  function schedulePersist() { clearTimeout(persistTimer); persistTimer = setTimeout(persistNow, 250); }

  // ============ HISTORIAL ============
  function saveHistory() {
    const state = {
      strokes: JSON.parse(JSON.stringify(S.strokes)),
      shapes: JSON.parse(JSON.stringify(S.shapes)),
      media: S.media.map(m => ({...m})),
      texts: S.texts.map(t => ({...t})),
      widgets: JSON.parse(JSON.stringify(S.widgets)),
      z: S.z,
    };
    S.history = S.history.slice(0, S.historyIndex + 1);
    S.history.push(state);
    if (S.history.length > S.maxHistory) S.history.shift();
    S.historyIndex = S.history.length - 1;
    schedulePersist();
  }
  function undo() {
    if (S.historyIndex <= 0) return;
    S.historyIndex--; restoreHistory();
  }
  function redo() {
    if (S.historyIndex >= S.history.length - 1) return;
    S.historyIndex++; restoreHistory();
  }
  function restoreHistory() {
    const state = S.history[S.historyIndex];
    if (!state) return;
    S.strokes = JSON.parse(JSON.stringify(state.strokes));
    S.shapes = JSON.parse(JSON.stringify(state.shapes));
    S.media = state.media.map(m => ({...m}));
    S.texts = state.texts.map(t => ({...t}));
    S.widgets = JSON.parse(JSON.stringify(state.widgets || []));
    S.z = state.z;
    S.selected = null; S.selKind = null;
    redraw(); renderMedia(); renderTexts(); renderWidgets(); renderChrome();
  }

  // ============ YOUTUBE / MEDIA ============
  function ytId(text) {
    if (!text) return null;
    const m = String(text).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function giphyId(url) {
    const m = url.match(/giphy\.com\/(?:media\/(?:[^/]+\/)?|embed\/|)([a-zA-Z0-9]{4,})/i)
      || url.match(/i\.giphy\.com\/([a-zA-Z0-9]+)\./i)
      || url.match(/media\d*\.giphy\.com\/media\/(?:[^/]+\/)?([a-zA-Z0-9]+)/i);
    return m && m[1] !== "media" ? m[1] : null;
  }
  function animatedUrl(url) {
    if (!url) return url;
    const gid = giphyId(url);
    if (gid) return "https://i.giphy.com/" + gid + ".gif";
    if (/tenor\.com|c\.tenor/i.test(url)) {
      return url.replace(/nanogif|tinygif|mp4/gi, "gif").replace(/\.mp4(\?|$)/i, ".gif$1").replace(/\.webp(\?|$)/i, ".gif$1");
    }
    return url;
  }
  function isAnimHint(u) {
    u = (u || "").toLowerCase();
    return /\.gif(\?|$)/.test(u) || /giphy|tenor|gfycat/.test(u);
  }
  function isVideo(u) {
    return /\.(mp4|webm|mov)(\?|$)/i.test(u || "") || /tenor\.com.*\.mp4/i.test(u || "");
  }
  function decodeHtml(s) { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; }
  function urlsFromHtml(html) {
    const out = [];
    const re = /(?:src|data-src|data-original|href)=["']([^"']+)["']/gi;
    let m; while ((m = re.exec(html))) out.push(decodeHtml(m[1]));
    return out;
  }
  async function pastePayload(e) {
    const d = e.clipboardData; if (!d) return null;
    const text = d.getData("text/plain") || d.getData("text/uri-list");
    const html = d.getData("text/html");
    const y = ytId(text) || ytId(html);
    if (y) return { kind: "youtube", id: y };
    const urls = [];
    if (html) urls.push(...urlsFromHtml(html));
    if (text && /^https?:/i.test(text.trim())) urls.push(text.trim());
    const gifUrl = urls.map(animatedUrl).find((u) => /^https?:/i.test(u) && (isAnimHint(u) || isVideo(u)));
    if (gifUrl) return { kind: isVideo(gifUrl) ? "video" : "image", src: gifUrl };
    const anyImg = urls.map(animatedUrl).find((u) => /^https?:/i.test(u) && /\.(gif|png|jpe?g|webp|svg)(\?|$)/i.test(u));
    const items = [...d.items];
    const gifItem = items.find((i) => i.type === "image/gif");
    if (gifItem) { const f = gifItem.getAsFile(); if (f) return { kind: "image", src: URL.createObjectURL(f) }; }
    if (anyImg) return { kind: "image", src: anyImg };
    const imgItem = items.find((i) => i.type.startsWith("image/"));
    if (imgItem) {
      const f = imgItem.getAsFile();
      if (f) return { kind: "image", src: URL.createObjectURL(f) };
    }
    const videoItem = items.find((i) => i.type.startsWith("video/"));
    if (videoItem) {
      const f = videoItem.getAsFile();
      if (f) return { kind: "video", src: URL.createObjectURL(f) };
    }
    if (text && text.trim()) return { kind: "text", text: text.trim() };
    return null;
  }

  // ============ GEOMETRÍA ============
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function distSeg(p, a, b) {
    const l2 = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
    if (!l2) return dist(p, a);
    let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
    t = Math.max(0, Math.min(1, t));
    return dist(p, { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) });
  }
  function hitStroke(s, p) {
    if (s.kind === "erase") return false;
    const tol = s.width / 2 + 8;
    const a = s.points[0], b = s.points[1] || a;
    if (s.kind === "path" || s.kind === "highlight") {
      for (let i = 1; i < s.points.length; i++) if (distSeg(p, s.points[i - 1], s.points[i]) <= tol) return true;
      return s.points.length === 1 && dist(p, a) <= tol;
    }
    return distSeg(p, a, b) <= tol;
  }
  function inPoly(p, pts) {
    let n = 0;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) n++;
    }
    return n % 2 === 1;
  }
  function rotatePt(p, c, deg) {
    const r = deg * Math.PI / 180, s = Math.sin(r), co = Math.cos(r);
    const dx = p.x - c.x, dy = p.y - c.y;
    return { x: c.x + dx * co - dy * s, y: c.y + dx * s + dy * co };
  }
  function snapAngle(p, ref) {
    if (!ref) return p;
    const snapAngles = [0, 30, 45, 60, 90, 120, 135, 150, 180, -30, -45, -60, -90, -120, -135, -150];
    const dx = p.x - ref.x, dy = p.y - ref.y;
    const d = Math.hypot(dx, dy);
    if (d < 3) return { x: ref.x, y: ref.y };
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    for (const a of snapAngles) {
      const diff = Math.abs(ang - a);
      if (diff < 6 || Math.abs(diff - 360) < 6) {
        const rad = a * Math.PI / 180;
        return { x: ref.x + Math.cos(rad) * d, y: ref.y + Math.sin(rad) * d };
      }
    }
    return p;
  }
  function snapShapeRect(x, y, w, h, kind) {
    if (kind === "square" || kind === "circle") {
      const s = Math.max(Math.abs(w), Math.abs(h));
      w = Math.sign(w) * s; h = Math.sign(h) * s;
    }
    if (kind === "rect" || kind === "oval" || kind === "quad" || kind === "ellipse") {
      w = Math.round(w / 5) * 5; h = Math.round(h / 5) * 5;
    }
    if (kind === "triEq") {
      const s = Math.max(Math.abs(w), Math.abs(h) / (Math.sqrt(3) / 2));
      w = Math.sign(w) * s; h = Math.sign(h) * s * Math.sqrt(3) / 2;
    }
    return { x, y, w, h };
  }

  function simplify(points, eps) {
    if (points.length < 3) return points.slice();
    let max = 0, idx = 0;
    for (let i = 1; i < points.length - 1; i++) {
      const d = distSeg(points[i], points[0], points.at(-1));
      if (d > max) { max = d; idx = i; }
    }
    if (max <= eps) return [points[0], points.at(-1)];
    return simplify(points.slice(0, idx + 1), eps).slice(0, -1).concat(simplify(points.slice(idx), eps));
  }
  function recognizeStroke(stroke) {
    const pts = stroke.points;
    if (!S.autoSnap || stroke.kind !== "path" || pts.length < 5) return null;
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const w = maxX - minX, h = maxY - minY, diag = Math.hypot(w, h);
    if (diag < 14) return null;
    const direct = dist(pts[0], pts.at(-1));
    const length = pts.slice(1).reduce((n, p, i) => n + dist(pts[i], p), 0);
    if (direct / Math.max(length, 1) > .94) return { stroke: { ...stroke, kind: "line", points: [pts[0], pts.at(-1)] } };
    if (direct >= Math.max(18, diag * .24)) return null;
    const cx = pts.reduce((n,p)=>n+p.x,0)/pts.length, cy = pts.reduce((n,p)=>n+p.y,0)/pts.length;
    const radii = pts.map(p => Math.hypot(p.x-cx,p.y-cy));
    const mean = radii.reduce((a,b)=>a+b,0)/radii.length;
    const variation = Math.sqrt(radii.reduce((n,r)=>n+(r-mean)**2,0)/radii.length) / Math.max(mean,1);
    const aspect = Math.min(w,h) / Math.max(w,h);
    if (variation < .16) return { shape: { id: uid(), kind: aspect > .82 ? "circle" : "oval", x:minX, y:minY, w, h, rotation:0, color:stroke.color, width:stroke.width, z:++S.z } };
    let poly = simplify(pts.concat([pts[0]]), Math.max(5, diag * .055));
    if (dist(poly[0], poly.at(-1)) < diag * .25) poly.pop();
    poly = poly.filter((p,i,a) => dist(p, a[(i+a.length-1)%a.length]) > diag*.08);
    const n = poly.length;
    let kind = n === 3 ? "triIso" : n === 4 ? (aspect > .82 ? "square" : "rect") : n === 5 ? "pent" : n === 6 ? "hex" : null;
    if (!kind) return null;
    return { shape: { id:uid(), kind, x:minX, y:minY, w, h, rotation:0, color:stroke.color, width:stroke.width, z:++S.z } };
  }

  // ============ FORMAS ============
  function shapeGeom(sh) {
    const { x, y, w, h, kind } = sh;
    const x2 = x + w, y2 = y + h, cx = x + w / 2, cy = y + h / 2;
    const regular = (n) => {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + i * 2 * Math.PI / n;
        pts.push({ x: cx + Math.cos(a) * w / 2, y: cy + Math.sin(a) * h / 2 });
      }
      return pts;
    };
    if (kind === "circle") { const r = Math.min(Math.abs(w), Math.abs(h)) / 2; return { ellipse: true, cx, cy, rx: r, ry: r }; }
    if (kind === "oval" || kind === "ellipse") return { ellipse: true, cx, cy, rx: Math.abs(w) / 2, ry: Math.abs(h) / 2 };
    let pts;
    if (kind === "triEq") {
      const side = Math.min(Math.abs(w), Math.abs(h) / (Math.sqrt(3) / 2));
      const hh = side * Math.sqrt(3) / 2;
      pts = [{ x: cx, y: cy - hh / 2 }, { x: cx + side / 2, y: cy + hh / 2 }, { x: cx - side / 2, y: cy + hh / 2 }];
    } else if (kind === "triIso") pts = [{ x: cx, y }, { x: x2, y: y2 }, { x, y: y2 }];
    else if (kind === "triSca") pts = [{ x: x + w * .08, y: y + h * .78 }, { x: x + w * .98, y: y + h * .62 }, { x: x + w * .38, y: y + h * .06 }];
    else if (kind === "triRight") pts = [{ x, y: y2 }, { x, y }, { x: x2, y: y2 }];
    else if (kind === "square") {
      const s = Math.min(Math.abs(w), Math.abs(h)), sx = cx - s / 2, sy = cy - s / 2;
      pts = [{ x: sx, y: sy }, { x: sx + s, y: sy }, { x: sx + s, y: sy + s }, { x: sx, y: sy + s }];
    } else if (kind === "rect" || kind === "quad") pts = [{ x, y }, { x: x2, y }, { x: x2, y: y2 }, { x, y: y2 }];
    else if (kind === "pent") pts = regular(5);
    else if (kind === "hex") pts = regular(6);
    else pts = [{ x, y }, { x: x2, y }, { x: x2, y: y2 }, { x, y: y2 }];
    return { pts };
  }
  function shapeWorldPts(sh) {
    const g = shapeGeom(sh);
    const c = { x: sh.x + sh.w / 2, y: sh.y + sh.h / 2 };
    if (g.ellipse) return g;
    return { pts: g.pts.map((p) => rotatePt(p, c, sh.rotation || 0)) };
  }
  function hitShape(sh, p) {
    const g = shapeWorldPts(sh);
    const c = { x: sh.x + sh.w / 2, y: sh.y + sh.h / 2 };
    if (g.ellipse) {
      const q = rotatePt(p, c, -(sh.rotation || 0));
      const nx = (q.x - g.cx) / (g.rx || 1), ny = (q.y - g.cy) / (g.ry || 1);
      return nx * nx + ny * ny <= 1.12;
    }
    return inPoly(p, g.pts);
  }
  function hitMedia(m, p) {
    const c = { x: m.x + m.w / 2, y: m.y + m.h / 2 };
    const q = rotatePt(p, c, -(m.rotation || 0));
    return q.x >= m.x && q.x <= m.x + m.w && q.y >= m.y && q.y <= m.y + m.h;
  }
  function hitText(t, p) {
    const c = { x: t.x + t.w / 2, y: t.y + (t.h||40) / 2 };
    const q = rotatePt(p, c, -(t.rotation || 0));
    return q.x >= t.x && q.x <= t.x + t.w && q.y >= t.y && q.y <= t.y + (t.h||40);
  }

  // ============ TEXTO ============
  function addText(x, y) {
    const t = {
      id: uid(), x: x ?? 100, y: y ?? 100,
      w: 220, h: 40, content: "", rotation: 0, z: ++S.z,
    };
    S.texts.push(t);
    S.selected = t.id; S.selKind = "text";
    renderTexts();
    setTimeout(() => enterEditMode(t.id), 30);
    saveHistory();
    return t;
  }
  function addPastedText(text, x, y) {
    const t = addText(x, y);
    t.content = String(text).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/\n/g,"<br>");
    renderTexts(); exitEditMode(); saveHistory();
  }
  function enterEditMode(id) {
    const t = S.texts.find(x => x.id === id);
    if (!t) return;
    // Salir de edición previa
    if (S.editingText && S.editingText !== id) {
      const prevEl = document.querySelector(`[data-text-id="${S.editingText}"] .text-content`);
      if (prevEl) {
        const prevT = S.texts.find(x => x.id === S.editingText);
        if (prevT) prevT.content = prevEl.innerHTML;
        prevEl.contentEditable = "false";
      }
    }
    S.editingText = id;
    // Resetear selección visual para mostrar la caja
    S.selected = id; S.selKind = "text";
    renderChrome();
    const el = document.querySelector(`[data-text-id="${id}"]`);
    if (!el) return;
    const inner = el.querySelector(".text-content");
    inner.contentEditable = "true";
    inner.focus();
    // Colocar cursor al final
    try {
      const range = document.createRange();
      range.selectNodeContents(inner);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
    } catch(_) {}
    showTextToolbar(t);
    updateToolbarState();
  }
  function exitEditMode() {
    if (!S.editingText) return;
    const id = S.editingText;
    S.editingText = null;
    const el = document.querySelector(`[data-text-id="${id}"]`);
    const t = S.texts.find(x => x.id === id);
    if (el && t) {
      const inner = el.querySelector(".text-content");
      inner.contentEditable = "false";
      // Si quedó vacío, eliminar
      const plainText = inner.textContent.trim();
      const hasList = inner.querySelector("ul,ol,li");
      if (!plainText && !hasList && !inner.querySelector("img")) {
        S.texts = S.texts.filter(x => x.id !== id);

  window.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const p = worldPt(e), o = drag.orig, d = { x: p.x - drag.start.x, y: p.y - drag.start.y };
    const arr = drag.kind === "shape" ? S.shapes : drag.kind === "media" ? S.media : drag.kind === "widget" ? S.widgets : S.texts;
    const m = arr.find((x) => x.id === drag.id); if (!m) return;
    if (drag.handle === "move") { m.x = o.x + d.x; m.y = o.y + d.y; }
    else if (drag.handle === "rot") {
      const cx = o.x + o.w / 2, cy = o.y + (o.h || 40) / 2;
      const a0 = Math.atan2(drag.start.y - cy, drag.start.x - cx);
      const a1 = Math.atan2(p.y - cy, p.x - cx);
      let rot = (o.rotation || 0) + (a1 - a0) * 180 / Math.PI;

      m.rotation = rot;
    } else {
      let { x, y, w } = o; let h = o.h || 40;

      if (drag.handle.includes("w")) { w = Math.max(40, o.w - d.x); x = o.x + o.w - w; }
      if (drag.handle.includes("n")) { h = Math.max(30, (o.h || 40) - d.y); y = o.y + (o.h || 40) - h; }
      if (S.autoSnap && drag.kind === "shape") {

    if (node) node.style.cssText = `left:${m.x}px;top:${m.y}px;width:${m.w}px;height:${m.h||40}px;transform:rotate(${m.rotation||0}deg);z-index:${m.z}`;

  function openMenu(x, y, id, kind) {
    menu.style.display = "block";
    menu.style.left = x + "px"; menu.style.top = y + "px";
    menu.innerHTML = `<button data-a="top">Traer al frente${kind === "media" ? " de multimedia" : ""}</button>

      const a = e.target.dataset.a; if (!a) return;
      const arr = kind === "shape" ? S.shapes : kind === "media" ? S.media : kind === "widget" ? S.widgets : S.texts;
      const list = arr.slice().sort((p, q) => p.z - q.z);

      if (a === "bottom") list[i].z = Math.min(...list.map((m) => m.z)) - 1;
      if (a === "up" && i < list.length - 1) { const z = list[i].z; list[i].z = list[i + 1].z; list[i + 1].z = z; }
      if (a === "down" && i > 0) { const z = list[i].z; list[i].z = list[i - 1].z; list[i - 1].z = z; }

        if (kind === "shape") S.shapes = S.shapes.filter((m) => m.id !== id);

  function addImage(src, x, y, type) {

      const max = 420, r = Math.min(max / w, max / h, 1);
      const bottomZ = S.media.length ? Math.min(...S.media.map(m => m.z || 0)) - 1 : 0;

  function attachMarkerEvents(b, kind, i) {
    let pressTimer = null;
    let longPressed = false;
    let startX = 0, startY = 0;
    const openPicker = () => {
      const inp = document.createElement("input");
      inp.type = "color";

      inp.style.cssText = "position:fixed;opacity:0;pointer-events:none;left:0;top:0;width:1px;height:1px;";
      document.body.appendChild(inp);
      const handler = () => {
        if (kind === "pen") {
          S.penColors[i] = inp.value;
          b.querySelector(".nib").style.background = inp.value;
        } else {
          S.hlColor = inp.value;
          b.querySelector(".nib").style.background = inp.value;
          hlColor.value = inp.value;
          updateHlSwatches();

    b.addEventListener("pointerdown", (e) => {
      e.stopPropagation();

        setTool("pen");
        refreshMarkerIndicators();

  // ============ INTERACCIÓN CANVAS ============
  function pickObject(p) {
    const widgets = S.widgets.slice().sort((a,b)=>(b.z||0)-(a.z||0));
    for (const item of widgets) if (hitWidget(item,p)) return {kind:"widget",item};
    const texts = S.texts.slice().sort((a,b)=>(b.z||0)-(a.z||0));
    for (const item of texts) if (hitText(item,p)) return {kind:"text",item};
    const shapes = S.shapes.slice().sort((a,b)=>(b.z||0)-(a.z||0));
    for (const item of shapes) if (hitShape(item,p)) return {kind:"shape",item};
    const media = S.media.slice().sort((a,b)=>(b.z||0)-(a.z||0));
    for (const item of media) if (hitMedia(item,p)) return {kind:"media",item};
    return null;
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button === 2) {
      e.preventDefault();
      rightPress={pointerId:e.pointerId,x:e.clientX,y:e.clientY,active:false,timer:setTimeout(()=>{if(!rightPress)return;rightPress.active=true;panning=true;last={x:rightPress.x,y:rightPress.y};canvas.style.cursor="grabbing"},220)};

    }
    const p = worldPt(e);

    // TEXTO: doble clic en el lienzo
    if (S.tool === "text") {
      const now = Date.now();
      const hit = pickObject(p);
      if (S.textClick && now - S.textClick < 400) {
        if (hit && hit.kind === "text") {
          // Editar el texto existente
          enterEditMode(hit.item.id);
        } else {
          addText(p.x - 100, p.y - 20);

        S.textClick = now;

      const hit = pickObject(p);

        S.mediaInteractive = null;
        S.selected = hit.item.id; S.selKind = hit.kind;
        drag = { handle: "move", start: p, orig: { ...hit.item }, id: hit.item.id, kind: hit.kind };
      } else {
        S.selected = null; S.selKind = null; S.mediaInteractive = null;
      }
      renderMedia();
      return;
    }
    if (S.tool === "eraseStroke") {
      const hit = pickObject(p);
      if (hit) {
        if (hit.kind === "shape") S.shapes = S.shapes.filter((x) => x.id !== hit.item.id);
        else if (hit.kind === "media") S.media = S.media.filter((x) => x.id !== hit.item.id);
        else if (hit.kind === "widget") S.widgets = S.widgets.filter((x) => x.id !== hit.item.id);
        else S.texts = S.texts.filter((x) => x.id !== hit.item.id);

  canvas.addEventListener("pointermove", (e) => {

  window.addEventListener("paste", async (e) => {

  // ============ EXPORTAR ============
  async function snapshot() {
    const dpr = devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const out = document.createElement("canvas");
    out.width = w * dpr; out.height = h * dpr;
    const o = out.getContext("2d");
    o.fillStyle = getComputedStyle(document.body).backgroundColor || "#f3f1eb";
    o.fillRect(0, 0, out.width, out.height);
    o.setTransform(dpr * S.scale, 0, 0, dpr * S.scale, S.panX * dpr, S.panY * dpr);
    const loadImg = (src) => new Promise((res) => {
      const im = new Image();
      im.crossOrigin = "anonymous";
      im.onload = () => res(im);
      im.onerror = () => res(null);
      im.src = src;
    });
    const highlights = S.strokes.filter(s => s.kind === "highlight");
    const normalStrokes = S.strokes.filter(s => s.kind !== "highlight");
    const prev = ctx;
    ctx = o;
    highlights.forEach(paintStroke);
    ctx = prev;
    const media = S.media.slice().sort((a, b) => a.z - b.z);
    for (const m of media) {
      o.save();
      o.translate(m.x + m.w / 2, m.y + m.h / 2);
      o.rotate((m.rotation || 0) * Math.PI / 180);
      o.translate(-(m.x + m.w / 2), -(m.y + m.h / 2));
      let src = m.src;
      if (m.type === "youtube") src = "https://i.ytimg.com/vi/" + m.src + "/hqdefault.jpg";
      let im = (m.type === "image" || m.type === "youtube") ? await loadImg(src) : null;
      if (m.type === "video") {
        const video=mediaWorld.querySelector(`[data-media-id="${m.id}"] video`);
        if(video&&video.readyState>=2){
          const frame=document.createElement("canvas");frame.width=Math.max(2,video.videoWidth||640);frame.height=Math.max(2,video.videoHeight||360);
          try{frame.getContext("2d").drawImage(video,0,0,frame.width,frame.height);frame.toDataURL("image/png");im=frame}catch(_){im=null}
        }
      }
      try { if (im) o.drawImage(im, m.x, m.y, m.w, m.h); else throw 0; }
      catch (_) { o.fillStyle = "#f1f5f9"; o.fillRect(m.x,m.y,m.w,m.h);o.strokeStyle="#94a3b8";o.strokeRect(m.x,m.y,m.w,m.h);o.fillStyle="#475569";o.font="14px system-ui";o.fillText(m.type==="video"?"Video (sin fotograma disponible)":"Recurso externo",m.x+12,m.y+24); }
      o.restore();
    }
    ctx = o;
    S.shapes.forEach(paintShape);
    normalStrokes.forEach(paintStroke);
    ctx = prev;
    for (const t of S.texts) {
      const el = document.querySelector(`[data-text-id="${t.id}"] .text-content`);
      if (!el) continue;
      o.save();
      o.translate(t.x + t.w / 2, t.y + (t.h||40) / 2);
      o.rotate((t.rotation || 0) * Math.PI / 180);
      o.translate(-(t.x + t.w / 2), -(t.y + (t.h||40) / 2));
      const text = el.innerText || "";
      const lines = text.split('\n');
      o.font = '18px "Segoe UI", system-ui, sans-serif';
      o.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#1b1b18';
      o.textBaseline = 'top';
      let ty = t.y + 6;
      lines.forEach(line => {
        o.fillText(line, t.x + 8, ty);
        ty += 26;
      });
      o.restore();
    }
    for(const w of S.widgets){
      o.save();o.translate(w.x+w.w/2,w.y+w.h/2);o.rotate((w.rotation||0)*Math.PI/180);o.translate(-(w.x+w.w/2),-(w.y+w.h/2));
      const cv=widgetWorld.querySelector(`[data-widget-id="${w.id}"] canvas`);
      if(cv)o.drawImage(cv,w.x,w.y,w.w,w.h);else if(w.type==="table"){o.fillStyle="#fff";o.fillRect(w.x,w.y,w.w,w.h);o.strokeStyle="#94a3b8";const rows=w.rows||[],rh=Math.max(24,w.h/Math.max(rows.length,1)),cols=Math.max(1,...rows.map(r=>r.length)),cw=w.w/cols;o.font="12px system-ui";o.fillStyle="#1e293b";rows.forEach((r,ri)=>r.forEach((v,ci)=>{o.strokeRect(w.x+ci*cw,w.y+ri*rh,cw,rh);o.fillText(String(v).slice(0,24),w.x+ci*cw+5,w.y+ri*rh+16)}));}o.restore();
    }
    o.setTransform(dpr,0,0,dpr,0,0);o.fillStyle="rgba(255,255,255,.88)";o.fillRect(10,8,Math.min(350,w-20),30);o.fillStyle="#1b1b18";o.font="600 14px system-ui";o.fillText(boardTitle.value||`Pizarra CEPREDIX ${dateText()}`,18,28);
    return out;
  }
  function download(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function jpegToPdf(dataUrl, wPx, hPx) {
    const raw = atob(dataUrl.split(",")[1]);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const w = (wPx * 72 / 96).toFixed(2);
    const h = (hPx * 72 / 96).toFixed(2);
    const stream = `q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
    const enc = (str) => new TextEncoder().encode(str);
    const sizeOf = (x) => (typeof x === "string" ? enc(x).length : x.length);
    const chunks = ["%PDF-1.4\n"];
    const off = [0];
    const append = (x) => chunks.push(x);
    const soFar = () => chunks.reduce((a, c) => a + sizeOf(c), 0);
    off[1] = soFar();
    append("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    off[2] = soFar();
    append("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
    off[3] = soFar();
    append(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>\nendobj\n`);
    off[4] = soFar();
    append(`4 0 obj\n<< /Length ${stream.length} >>\nstream\n${stream}\nendstream\nendobj\n`);
    off[5] = soFar();
    append(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);
    append(bytes);
    append("\nendstream\nendobj\n");
    const xrefPos = soFar();
    let table = "xref\n0 6\n0000000000 65535 f \n";
    for (let i = 1; i <= 5; i++) table += String(off[i]).padStart(10, "0") + " 00000 n \n";
    append(table);
    append(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);
    const out = new Uint8Array(soFar());
    let n = 0;
    for (const c of chunks) {
      if (typeof c === "string") { const b = enc(c); out.set(b, n); n += b.length; }
      else { out.set(c, n); n += c.length; }
    }
    return new Blob([out], { type: "application/pdf" });
  }
  $("#expng").onclick = async () => {

  // ============ AMBIENTE SONORO ============
  const bars = $("#bars");

  const moodsBox = $("#moods");
  const moods = [
    { id: "focus",  label: "🎯 Enfoque",    notes: [110, 164.81, 196, 246.94], type: "sine",     cut: 720,  g: 0.11, lfo: 0.08, depth: 80,  reverb: 0.4, arp: null, noise: null },

    { id: "rain",   label: "🌧 Lluvia+pad", notes: [87.31, 130.81, 155.56, 196], type: "sine",   cut: 700,  g: 0.12, lfo: 0.06, depth: 70,  reverb: 0.65,arp: null, noise: "rain" },

  let actx, master, analyser, voices = [], lfo, arpT, noiseSrc, on = false;
  function stopRadio() {
    on = false; if (arpT) clearInterval(arpT); arpT = null;
    const t = actx ? actx.currentTime : 0;
    voices.forEach((v) => { try { v.gain.gain.setTargetAtTime(0, t, 0.08); v.osc.stop(t + .4); } catch (_) {} });
    voices = [];
    try { lfo && lfo.stop(); } catch (_) {}
    try { noiseSrc && noiseSrc.stop(); } catch (_) {}
    noiseSrc = null;
    $("#radioplay").textContent = "▶";
  }
  async function startRadio() {
    if (!actx) {
      actx = new AudioContext();
      master = actx.createGain(); master.gain.value = +$("#vol").value;
      analyser = actx.createAnalyser(); analyser.fftSize = 64;
      master.connect(analyser); analyser.connect(actx.destination);
    }
    await actx.resume();
    stopRadio(); on = true; $("#radioplay").textContent = "⏸";
    const sp = moods.find(m => m.id === mood), now = actx.currentTime;
    const reverb = actx.createConvolver();
    const irLen = 2;
    const ir = actx.createBuffer(2, actx.sampleRate * irLen, actx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = ir.getChannelData(ch);
      for (let i = 0; i < ir.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ir.length, 2.5);
    }
    reverb.buffer = ir;
    const reverbGain = actx.createGain(); reverbGain.gain.value = sp.reverb;
    reverb.connect(reverbGain); reverbGain.connect(master);
    sp.notes.forEach((f, i) => {
      const osc = actx.createOscillator(), gain = actx.createGain(), filter = actx.createBiquadFilter();
      osc.type = sp.type; osc.frequency.value = f;
      osc.detune.value = (i % 2 === 0 ? 4 : -4);
      filter.type = "lowpass"; filter.frequency.value = sp.cut;
      filter.Q.value = 2;
      gain.gain.value = 0; gain.gain.linearRampToValueAtTime(sp.g, now + .8 + i * .1);
      osc.connect(filter); filter.connect(gain);
      gain.connect(master); gain.connect(reverb);
      osc.start();
      voices.push({ osc, gain, filter, baseFreq: f });
    });
    lfo = actx.createOscillator(); const lg = actx.createGain();
    lfo.frequency.value = sp.lfo; lg.gain.value = sp.depth;
    lfo.connect(lg); voices.forEach((v) => lg.connect(v.filter.frequency)); lfo.start();
    if (sp.arp) {
      let step = 0;
      arpT = setInterval(() => {
        const v = voices[step % voices.length]; if (!v) return;
        const octave = step % 8 < 4 ? 1 : 2;
        v.osc.frequency.setTargetAtTime(sp.notes[(step + 1) % sp.notes.length] * octave, actx.currentTime, 0.02);
        step++;
      }, sp.arp);
    }
    if (sp.noise) {
      const bufSize = actx.sampleRate * 2;
      const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
      const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
      const filter = actx.createBiquadFilter(); filter.type = "bandpass"; filter.frequency.value = 200; filter.Q.value = 0.7;
      const g = actx.createGain(); g.gain.value = sp.noise === "rain" ? 0.06 : 0.03;
      src.connect(filter); filter.connect(g); g.connect(master);
      src.start(); noiseSrc = src;
    }
    on = true;
  }
  $("#radioplay").onclick = () => on ? stopRadio() : startRadio();
  $("#vol").oninput = (e) => { if (master) master.gain.value = +e.target.value; };
  (function vis() {

  })();

  // ============ INICIALIZAR ============
  window.addEventListener("resize", () => { redraw(); renderTexts(); renderWidgets(); if (S.tool === "highlight") positionHlPicker(); });
  try {
    const saved = JSON.parse(localStorage.getItem("pizarra-personal-v2") || "null");

  setTimeout(() => hint.classList.add("hide"), 12000);
})();
